{% extends "base.html" %}{% block title %}{{ page_title }} — Awareness{% endblock %}{% block content %}
<div class="page-head"><div><h1>{{ page_title }}</h1><div class="muted">Основные сведения о сотруднике</div></div><a class="btn" href="{% if employee %}{% url 'employee_detail' employee.pk %}{% else %}{% url 'employee_list' %}{% endif %}">← Назад</a></div>
<div class="panel" style="max-width:780px"><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<div class="btn-row"><button class="btn btn-primary" type="submit">Сохранить</button><a class="btn" href="{% url 'employee_list' %}">Отмена</a></div></form></div>
{% endblock %}
