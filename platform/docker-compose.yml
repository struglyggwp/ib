services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-awareness}
      POSTGRES_USER: ${POSTGRES_USER:-awareness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/app/entrypoint.sh"]
    volumes:
      - static_data:/app/staticfiles
    networks: [backend]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    user: "10001:10001"
    networks: [backend]

  smtp-relay:
    profiles: ["zimbra"]
    build: .
    command: ["python", "relay.py"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    environment:
      PORTAL_MAIL_RELAY: "1"
      PORTAL_RELAY_IP: ${ZIMBRA_LAN_IP:-}
      PORTAL_RELAY_PORT: "587"
    networks:
      backend:
        aliases: ["${ZIMBRA_TLS_NAME:-mail.corp.test}"]
      smtp-lan: {}

  mailpit:
    image: axllent/mailpit:v1.30.4
    profiles: ["mailtest"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "${PORTAL_BIND_IP:-127.0.0.1}:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/static:ro
    networks: [backend]

networks:
  backend:
    driver: bridge
    internal: true
  smtp-lan:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_data:
