<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Практика ИБ — внутренний портал обучения информационной безопасности.">
  <title>Практика ИБ</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-heading">К содержанию</a>
  <div id="auth" class="auth-frame">Загрузка портала…</div>
  <div class="shell" id="shell" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Боковая панель">
      <a class="brand" href="#">
        <span class="brand-symbol"><span class="icon i-shield" aria-hidden="true"></span></span>
        <span><strong>Практика ИБ</strong><small>Учебный портал</small></span>
      </a>
      <nav class="navigation" id="navigation" aria-label="Основное меню"></nav>
      <div class="sidebar-footer">
        <div class="environment">
          <span class="icon i-shield" aria-hidden="true"></span>
          <div><strong>Корпоративное обучение</strong><small id="account-email"></small></div>
        </div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-location">
          <button type="button" class="icon-button mobile-menu" id="menu-toggle" aria-expanded="false" aria-controls="sidebar" aria-label="Открыть меню">
            <span class="icon i-menu" aria-hidden="true"></span>
          </button>
          <strong id="topbar-page"></strong>
        </div>
        <div class="topbar-profile">
          <span id="account-name"></span>
          <button class="button button-secondary button-sm" type="button" id="logout">Выйти</button>
        </div>
      </header>
      <main id="main" class="workspace-content"></main>
    </div>
  </div>
  <button type="button" class="mobile-backdrop" id="menu-backdrop" aria-label="Закрыть меню" hidden></button>
  <dialog id="overlay" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
