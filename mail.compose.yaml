services:
  app:
    env_file: ./secrets/smtp.env
    environment:
      PORTAL_SMTP_HOST: ${PORTAL_SMTP_HOST:?Укажите имя Zimbra в .env}
      PORTAL_SMTP_PORT: "2587"
    volumes:
      - ./secrets:/run/portal-mail:ro

  mail:
    image: praktika-ib:1.1
    pull_policy: never
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    dns: [127.0.0.1]
    command: ["python", "relay.py"]
    environment:
      PORTAL_MAIL_RELAY: "1"
      PORTAL_RELAY_IP: ${PORTAL_SMTP_IP:?Укажите внутренний IPv4-адрес Zimbra в .env}
      PORTAL_RELAY_PORT: ${PORTAL_SMTP_PORT:-587}
    networks:
      practice:
        aliases: ["${PORTAL_SMTP_HOST}"]
      mail-egress:

networks:
  mail-egress:
    driver: bridge
